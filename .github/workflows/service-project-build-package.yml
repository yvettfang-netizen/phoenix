name: Service Project build and package
on:
  pull_request:
    paths:
      - 'ops/service-project-staging/**'
      - 'website/phoenix-nova-website-v5/**'
      - 'Phoenix Compass/education compass/server/**'
      - 'database/canonical/forward-candidates/service-workbench/**'
      - '.github/workflows/service-project-build-package.yml'
permissions:
  contents: read
concurrency:
  group: service-project-build-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  canonical-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 16
            image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
          - version: 17
            image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run preflight, fresh apply and role checks against PostgreSQL ${{ matrix.version }}
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        run: |
          set -Eeuo pipefail
          umask 077
          db_env="$(mktemp "$RUNNER_TEMP/service-project-db.XXXXXX")"
          printf 'POSTGRES_USER=phoenix_bootstrap\nPOSTGRES_DB=phoenix_service_project_staging\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" > "$db_env"
          container="$(docker run --detach --rm --network none --mount "type=bind,source=$PWD,target=/review,readonly" --env-file "$db_env" "$POSTGRES_IMAGE")"
          trap 'docker rm -f -v "$container" >/dev/null; rm -f "$db_env"' EXIT
          for attempt in $(seq 1 60); do
            if docker exec "$container" pg_isready -q -h 127.0.0.1; then break; fi
            sleep 1
          done
          docker exec "$container" bash -c '
            set -Eeuo pipefail
            umask 077
            export PGPASSFILE=/tmp/phoenix-build-stage.pgpass
            printf "127.0.0.1:5432:phoenix_service_project_staging:phoenix_bootstrap:%s\n" "$POSTGRES_PASSWORD" > "$PGPASSFILE"
            cd /review
            bash ops/service-project-staging/db-preflight.test.sh
            bash ops/service-project-staging/db-preflight.sh --user phoenix_bootstrap
            bash ops/service-project-staging/db-apply.sh --confirm-staging --user phoenix_bootstrap
            bash ops/service-project-staging/db-role-preflight.sh --user phoenix_bootstrap
            if bash ops/service-project-staging/db-preflight.sh --user phoenix_bootstrap; then
              echo "Expected repeat preflight to refuse a non-empty staging database" >&2
              exit 1
            fi
          '
  linux-worker-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
      - name: Build immutable Worker and API artifacts
        run: bash ops/service-project-staging/stage.sh build "$(git rev-parse HEAD)"
      - name: Scope the new runtime and bridge tests
        working-directory: website/phoenix-nova-website-v5
        run: |
          node --import ./tests/register-typescript.mjs --test tests/workbench-private-staging.test.mjs tests/customer-canonical-bridge.test.mjs tests/service-workbench.test.mjs tests/service-workbench-identity.test.mjs tests/family-service-overview.test.mjs
      - name: Start built Worker in a runner-only private runtime
        run: |
          set -Eeuo pipefail
          umask 077
          state="$(mktemp -d "$RUNNER_TEMP/phoenix-service-project.XXXXXX")"
          node -e 'console.log("WORKBENCH_STAGING_IDENTITY_KEY="+require("node:crypto").randomBytes(32).toString("base64url"))' > "$state/worker.env"
          bash ops/service-project-staging/stage.sh worker-smoke "$(git rev-parse HEAD)" "$state" > "$state/runtime.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; wait "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4775/__service-project-staging/health >/dev/null 2>&1; then break; fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if ! bash ops/service-project-staging/verify.sh smoke; then
            sed -E 's/[A-Za-z0-9_-]{32,}/[redacted]/g' "$state/runtime.log"
            exit 1
          fi
      - name: Package checked build artifacts
        run: |
          set -Eeuo pipefail
          tar --sort=name -czf "$RUNNER_TEMP/service-project-runtime.tgz" \
            website/phoenix-nova-website-v5/dist 'Phoenix Compass/education compass/server/dist'
          (cd "$RUNNER_TEMP"; sha256sum service-project-runtime.tgz > service-project-runtime.tgz.sha256)
      - name: Preserve build receipt and runtime bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: service-project-build-receipt
          include-hidden-files: true
          path: |
            website/phoenix-nova-website-v5/dist/.service-project-stage-sha
            website/phoenix-nova-website-v5/dist/.service-project-stage-hashes
            ${{ runner.temp }}/service-project-runtime.tgz
            ${{ runner.temp }}/service-project-runtime.tgz.sha256
