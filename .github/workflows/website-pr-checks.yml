name: Website PR checks

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-pr-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.site }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site:
          - website/phoenix-nova-website-v5
          - website/phoenix-digital-world
          - website/phoenix-east
    defaults:
      run:
        working-directory: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: ${{ matrix.site }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
