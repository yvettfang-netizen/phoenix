name: Canonical 0035 pre-merge smoke
on:
  pull_request:
    paths:
      - 'database/canonical/**'
      - 'docs/database/premerge-0035/**'
      - '.github/workflows/canonical-0035-premerge.yml'
  workflow_dispatch:
jobs:
  public-candidate-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan allowlisted database files
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f'
          for path in database/canonical docs/database/premerge-0035 .github/workflows/canonical-0035-premerge.yml; do
            docker run --rm --mount "type=bind,source=$PWD/$path,target=/scan,readonly" "$image" dir /scan --redact=100 --no-banner --exit-code=1
          done
  isolated-postgres:
    strategy:
      fail-fast: false
      matrix:
        version: ['16','17']
        mode: ['fresh','upgrade']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Disposable synthetic migration smoke
        shell: pwsh
        run: ./database/canonical/verification/smoke.ps1 -Version '${{ matrix.version }}' -Mode '${{ matrix.mode }}'
  website-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website/phoenix-nova-website-v5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: website/phoenix-nova-website-v5/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  education-client-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Phoenix Compass/education compass
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.0.0
      - run: node tests/run-tests.js
      - run: node tests/validate-ui-contract.js
