name: Canonical 0037 public ID and read audit
on:
  pull_request:
    paths:
      - 'Phoenix Compass/education compass/server/**'
      - 'website/phoenix-nova-website-v5/**'
      - 'database/canonical/**'
      - 'docs/database/broker-session-bridge-20261105/**'
      - 'docs/database/closeout-gates-20261105/**'
      - '.github/workflows/canonical-0037-read-audit.yml'
permissions:
  contents: read
concurrency:
  group: canonical-0037-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scoped-read-audit:
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '17']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
      - name: Immutable SQL bytes and exact candidate inventory
        run: node database/canonical/verification/v0037/verify-source.mjs
      - name: Scoped public candidate scan
        run: |
          image='ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f'
          for path in 'docs/database/canonical-0037' 'docs/database/broker-session-bridge-20261105' 'docs/database/closeout-gates-20261105' 'Phoenix Compass/education compass/server/src/services/canonical-family-projection.ts' 'Phoenix Compass/education compass/server/src/auth/broker-identity.ts' 'Phoenix Compass/education compass/server/src/auth/session-family-bridge.ts' 'Phoenix Compass/education compass/server/tests/broker-session-bridge.test.ts' 'database/canonical/verification/v0037/broker-session-regression.mjs' 'Phoenix Compass/education compass/server/src/http/app.ts' 'website/phoenix-nova-website-v5/lib/canonical-family-projection.ts' 'website/phoenix-nova-website-v5/tests/canonical-family-projection.test.mjs' '.github/workflows/canonical-0037-read-audit.yml'; do
            docker run --rm --mount "type=bind,source=$PWD/$path,target=/scan,readonly" "$image" dir /scan --redact=100 --no-banner --exit-code=1
          done
      - name: Existing backend validation
        working-directory: Phoenix Compass/education compass/server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test
      - name: Existing website dependencies and contracts
        working-directory: website/phoenix-nova-website-v5
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/workerd/install.js
          node --test tests/canonical-family-projection.test.mjs
      - name: Isolated pinned synthetic browser
        run: |
          npm install --prefix "$RUNNER_TEMP/read-audit-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/read-audit-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Forward 0037 fresh upgrade negative audits browser and fresh restore
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/read-audit-browser/node_modules/playwright"
          node database/canonical/verification/v0037/projection-e2e.mjs '${{ matrix.pg }}'
