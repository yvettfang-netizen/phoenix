name: Health Compass V5 validation
on:
  pull_request:
    paths:
      - "website/phoenix-nova-website-v5/**"
      - ".github/workflows/health-compass-validation.yml"
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website/phoenix-nova-website-v5
    env:
      HEALTH_TEST_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: website/phoenix-nova-website-v5/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/health-browser.py
      - name: Health landing browser regression (both switch states)
        run: |
          export PLAYWRIGHT_MODULE="$(python -c 'import pathlib, playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          mkdir -p health-evidence/landing-off health-evidence/landing-on
          for enabled in 0 1; do
            export HEALTH_COMPASS_PREVIEW="$enabled"
            export HEALTH_TEST_PORT=4388
            export HEALTH_ORIGIN=http://127.0.0.1:4388
            export HEALTH_EXPECT_ENABLED="$enabled"
            if [ "$enabled" = 1 ]; then export HEALTH_EVIDENCE_DIR=health-evidence/landing-on; else export HEALTH_EVIDENCE_DIR=health-evidence/landing-off; fi
            node scripts/health-preview-server.mjs > "$HEALTH_EVIDENCE_DIR/preview.log" 2>&1 &
            preview_pid=$!
            trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 60); do
              if curl --fail --silent "$HEALTH_ORIGIN/zh/health" > /dev/null; then break; fi
              sleep 1
            done
            node tests/health-landing-browser.mjs
            HEALTH_EVIDENCE_DIR="$HEALTH_EVIDENCE_DIR/family" node tests/health-family-browser.mjs
            kill "$preview_pid"
            wait "$preview_pid" || true
            trap - EXIT
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-v5-${{ github.event.pull_request.head.sha }}
          path: website/phoenix-nova-website-v5/health-evidence/
          if-no-files-found: warn
          retention-days: 14
