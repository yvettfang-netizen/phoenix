name: Canonical Academy P0.1 A1 capability grants
on:
  pull_request:
    paths:
      - 'database/canonical/forward-candidates/academic-studio/**'
      - 'database/canonical/verification/academic-studio-p01/**'
      - '.github/workflows/canonical-academy-p01-a1.yml'
      - 'database/canonical/migrations/**'
permissions:
  contents: read
concurrency:
  group: canonical-academy-a1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
      - name: Verify source and test harness syntax
        run: |
          node --check database/canonical/verification/academic-studio-p01/academy-grants-acceptance.mjs
          node --check database/canonical/verification/academic-studio-p01/verify-a1-source.mjs
          node database/canonical/verification/academic-studio-p01/verify-a1-source.mjs
          node .github/scripts/verify-canonical-only.mjs
      - name: Scan candidate sources for credentials
        run: |
          image='ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f'
          for path in database/canonical/forward-candidates/academic-studio database/canonical/verification/academic-studio-p01; do
            docker run --rm --network none --mount "type=bind,source=$PWD/$path,target=/scan,readonly" "$image" dir /scan --redact=100 --no-banner --exit-code=1
          done
  isolated-postgres:
    strategy:
      fail-fast: false
      matrix:
        version: ['16','17']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: 'Phoenix Compass/education compass/server/package-lock.json'
      - name: Install existing PostgreSQL test client
        working-directory: Phoenix Compass/education compass/server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run disposable synthetic Academy grants tests
        run: node database/canonical/verification/academic-studio-p01/academy-grants-acceptance.mjs '${{ matrix.version }}'
