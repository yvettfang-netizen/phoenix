name: Enterprise V3 workspace authorization candidate
on:
  pull_request:
    paths:
      - 'database/canonical/forward-candidates/workspace-authorization/**'
      - 'database/canonical/verification/v0042/**'
      - 'Phoenix Compass/education compass/server/**'
      - 'docs/database/enterprise-v3-workspace-auth-p1-20261120/**'
      - '.github/workflows/enterprise-v3-workspace-auth-p1.yml'
permissions:
  contents: read
concurrency:
  group: enterprise-v3-workspace-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
      - name: Historical migration and 0042 source guard
        run: node database/canonical/verification/v0042/verify-source.mjs
      - name: Scoped secret scan
        run: |
          image='ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f'
          for path in \
            'database/canonical/forward-candidates/workspace-authorization' \
            'database/canonical/verification/v0042' \
            'docs/database/enterprise-v3-workspace-auth-p1-20261120' \
            'Phoenix Compass/education compass/server/src/services/canonical-workspace-access.ts' \
            'Phoenix Compass/education compass/server/tests/canonical-workspace-access.test.ts' \
            '.github/workflows/enterprise-v3-workspace-auth-p1.yml'; do
            docker run --rm --network none --mount "type=bind,source=$PWD/$path,target=/scan,readonly" "$image" dir /scan --redact=100 --no-banner --exit-code=1
          done
      - name: Existing backend tests typecheck and build
        working-directory: Phoenix Compass/education compass/server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test

  workspace-authorization:
    needs: source-and-server
    strategy:
      fail-fast: false
      matrix:
        pg: ['16','17']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
      - name: Build trusted backend module
        working-directory: Phoenix Compass/education compass/server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: PG fresh repeat drift atomicity and cross-organization authorization
        env:
          WORKSPACE_AUTH_EVIDENCE_DIR: ${{ runner.temp }}/workspace-auth-evidence/pg${{ matrix.pg }}
        run: node database/canonical/verification/v0042/acceptance.mjs '${{ matrix.pg }}'
      - name: Synthetic JSON evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enterprise-v3-workspace-auth-pg${{ matrix.pg }}
          path: ${{ runner.temp }}/workspace-auth-evidence/pg${{ matrix.pg }}/*.json
          if-no-files-found: error
