name: Identity Journey isolated candidate
on:
  pull_request:
    paths:
      - 'database/canonical/forward-candidates/identity-journey/**'
      - 'database/canonical/forward-candidates/service-workbench/0038_service_project_workbench.sql'
      - 'website/phoenix-nova-website-v5/lib/identity-journey*.ts'
      - 'website/phoenix-nova-website-v5/worker/index.ts'
      - 'website/phoenix-nova-website-v5/components/family-identity-inbox.tsx'
      - 'website/phoenix-nova-website-v5/components/family-identity-consultation.tsx'
      - 'website/phoenix-nova-website-v5/components/family-identity-timeline.tsx'
      - 'website/phoenix-nova-website-v5/components/family-identity-residence.tsx'
      - 'website/phoenix-nova-website-v5/components/family-identity-profile.tsx'
      - 'website/phoenix-nova-website-v5/components/family-identity-review-planning.tsx'
      - 'website/phoenix-nova-website-v5/components/family-identity-delegations.tsx'
      - 'website/phoenix-nova-website-v5/components/family-center-v2.tsx'
      - 'website/phoenix-nova-website-v5/components/family-center-v2.css'
      - 'website/phoenix-nova-website-v5/app/**/family-center/page.tsx'
      - 'website/phoenix-nova-website-v5/app/api/family-services/identity-notices/**'
      - 'website/phoenix-nova-website-v5/app/api/family-services/identity-consultation/**'
      - 'website/phoenix-nova-website-v5/app/api/family-services/identity-timeline/**'
      - 'website/phoenix-nova-website-v5/app/api/family-services/identity-residence/**'
      - 'website/phoenix-nova-website-v5/app/api/family-services/identity-profile/**'
      - 'website/phoenix-nova-website-v5/app/api/family-services/identity-member-residence/**'
      - 'website/phoenix-nova-website-v5/tests/identity-journey.test.mjs'
      - 'website/phoenix-nova-website-v5/app/api/family-services/identity-review-planning/**'
      - 'website/phoenix-nova-website-v5/app/api/family-services/identity-delegations/**'
      - '.github/workflows/identity-journey-candidate.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '17']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
      - run: node --experimental-strip-types --test website/phoenix-nova-website-v5/tests/identity-journey.test.mjs
      - run: |
          candidate=database/canonical/forward-candidates/identity-journey
          node --experimental-strip-types --import "./$candidate/register-native-typescript.mjs" --test "$candidate/consultation.test.mjs"
      - name: Install pinned browser and website components
        if: matrix.pg == '17'
        run: |
          npm ci --prefix website/phoenix-nova-website-v5 --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/identity-journey-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/identity-journey-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - run: bash database/canonical/forward-candidates/identity-journey/verify.sh '${{ matrix.pg }}'
        env:
          IDENTITY_BROWSER_EVIDENCE_DIR: ${{ matrix.pg == '17' && format('{0}/identity-inbox-evidence', runner.temp) || '' }}
          PLAYWRIGHT_MODULE: ${{ matrix.pg == '17' && format('{0}/identity-journey-browser/node_modules/playwright', runner.temp) || '' }}
      - name: Save synthetic inbox desktop and mobile evidence
        if: matrix.pg == '17' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: identity-inbox-browser
          path: ${{ runner.temp }}/identity-inbox-evidence/
          if-no-files-found: error
