name: Family OS P1 authorized dashboard
on:
  pull_request:
    paths:
      - 'website/phoenix-nova-website-v5/**'
      - 'Phoenix Compass/education compass/server/**'
      - 'database/canonical/verification/family-os-p1/**'
      - 'docs/database/family-os-dashboard-p1/**'
      - '.github/workflows/family-os-dashboard-p1.yml'
permissions:
  contents: read
concurrency:
  group: family-os-p1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authorized-dashboard:
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '17']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
      - name: Frozen P0 schema and candidate integrity; no P1 migration
        run: node database/canonical/verification/v0038/verify-source.mjs
      - name: Public candidate scan
        run: |
          image='ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f'
          for path in 'docs/database/family-os-dashboard-p1' 'database/canonical/verification/family-os-p1' 'Phoenix Compass/education compass/server/src/services/family-os-dashboard.ts' 'website/phoenix-nova-website-v5/lib/family-os-dashboard.ts' 'website/phoenix-nova-website-v5/components/family-os-dashboard.tsx' 'website/phoenix-nova-website-v5/components/family-os-dashboard.css' 'website/phoenix-nova-website-v5/tests/family-os-dashboard.test.mjs' 'website/phoenix-nova-website-v5/app/api/family-os' '.github/workflows/family-os-dashboard-p1.yml'; do
            docker run --rm --network none --mount "type=bind,source=$PWD/$path,target=/scan,readonly" "$image" dir /scan --redact=100 --no-banner --exit-code=1
          done
      - name: Existing backend typecheck build tests
        working-directory: Phoenix Compass/education compass/server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test
      - name: Website contracts and changed source validation
        working-directory: website/phoenix-nova-website-v5
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/workerd/install.js
          npm run typecheck
          node node_modules/eslint/bin/eslint.js components/family-os-dashboard.tsx lib/family-os-dashboard.ts lib/service-workbench-bff.ts 'app/[locale]/family-center/page.tsx' app/api/family-os/dashboard/route.ts
          node --import ./tests/register-typescript.mjs --test tests/family-os-dashboard.test.mjs tests/service-workbench.test.mjs tests/family-center-v2.test.mjs tests/canonical-family-projection.test.mjs tests/canonical-session-projection.test.mjs
      - name: Isolated pinned browser
        run: |
          npm install --prefix "$RUNNER_TEMP/dashboard-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/dashboard-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Actual PG different service authorizations and refusal cases
        run: |
          export FAMILY_DASHBOARD_EVIDENCE_DIR="$RUNNER_TEMP/family-dashboard"
          node database/canonical/verification/family-os-p1/api.mjs '${{ matrix.pg }}'
      - name: Actual homepage BFF API PG scenarios and browser refusal cases
        run: |
          export FAMILY_DASHBOARD_EVIDENCE_DIR="$RUNNER_TEMP/family-dashboard"
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/dashboard-browser/node_modules/playwright"
          node database/canonical/verification/family-os-p1/browser.mjs '${{ matrix.pg }}'
      - name: Synthetic results only; no configuration or database export
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: family-dashboard-pg${{ matrix.pg }}
          path: |
            ${{ runner.temp }}/family-dashboard/*.json
            ${{ runner.temp }}/family-dashboard/*.png
          if-no-files-found: warn
