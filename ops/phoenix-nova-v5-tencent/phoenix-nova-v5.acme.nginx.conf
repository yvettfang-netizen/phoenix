# Temporary HTTP-only vhost for process/domain verification and certbot webroot.
# Install at the same destination as the final TLS file, never enable both.
map $http_upgrade $phoenix_nova_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name phoenixnova.com.cn;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    access_log /var/log/nginx/phoenix-nova-v5.access.log;
    error_log /var/log/nginx/phoenix-nova-v5.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $phoenix_nova_connection_upgrade;
    proxy_set_header oai-authenticated-user-id "";
    proxy_set_header oai-authenticated-user-email "";
    proxy_set_header oai-authenticated-user-full-name "";
    proxy_set_header oai-authenticated-user-full-name-encoding "";
    proxy_set_header x-phoenix-surface "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location ^~ /wealth-compass {
        proxy_pass http://127.0.0.1:3001;
    }
    location ^~ /identity-compass {
        proxy_pass http://127.0.0.1:3002;
    }
    location ^~ /askwise {
        proxy_pass http://127.0.0.1:3003;
    }
    location ~ ^/(assessment|consent|result)(/|$) {
        return 302 /wealth-compass$request_uri;
    }
    location ^~ /report/ {
        return 302 /wealth-compass$request_uri;
    }
    location ^~ /uat {
        return 308 https://uat.phoenixnova.com.cn$request_uri;
    }
    location / {
        proxy_pass http://127.0.0.1:4315;
    }
}
