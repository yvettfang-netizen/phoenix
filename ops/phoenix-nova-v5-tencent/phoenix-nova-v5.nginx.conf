# Install as /etc/nginx/sites-available/phoenix-nova-v5 and enable only this
# final file after the phoenixnova.com.cn certificate has been issued.
# This file replaces the temporary ACME file at the same destination.
map $http_upgrade $phoenix_nova_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name phoenixnova.com.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://phoenixnova.com.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name phoenixnova.com.cn;

    ssl_certificate /etc/letsencrypt/live/phoenixnova.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phoenixnova.com.cn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/phoenixnova.com.cn/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PhoenixNovaV5TLS:10m;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/phoenix-nova-v5.access.log;
    error_log /var/log/nginx/phoenix-nova-v5.error.log warn;

    # Set the complete group here so every proxy location inherits it.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The standalone Node runtime uses this address for customer-auth limiting.
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $phoenix_nova_connection_upgrade;
    proxy_set_header oai-authenticated-user-id "";
    proxy_set_header oai-authenticated-user-email "";
    proxy_set_header oai-authenticated-user-full-name "";
    proxy_set_header oai-authenticated-user-full-name-encoding "";
    proxy_set_header x-phoenix-surface "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Retain existing public tool URLs without stripping their base paths.
    location ^~ /wealth-compass {
        proxy_pass http://127.0.0.1:3001;
    }
    location ^~ /identity-compass {
        proxy_pass http://127.0.0.1:3002;
    }
    location ^~ /askwise {
        proxy_pass http://127.0.0.1:3003;
    }

    # Preserve links shared before Wealth Compass gained its base path.
    location ~ ^/(assessment|consent|result)(/|$) {
        return 302 /wealth-compass$request_uri;
    }
    location ^~ /report/ {
        return 302 /wealth-compass$request_uri;
    }
    location ^~ /uat {
        return 308 https://uat.phoenixnova.com.cn$request_uri;
    }

    # The exact hostname reaches V5; existing default/API/UAT vhosts stay intact.
    location / {
        proxy_pass http://127.0.0.1:4315;
    }
}
